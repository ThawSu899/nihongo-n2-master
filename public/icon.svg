<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle for mobile app icon -->
  <rect width="512" height="512" rx="112" fill="#0c0a09"/>
  <!-- Circular Red Lacquer Crest -->
  <circle cx="256" cy="256" r="192" fill="url(#bg)" stroke="#fb7185" stroke-width="6"/>
  <!-- Inner Gold Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="10 8" opacity="0.85"/>
  <!-- Subtle Clover / Mon petal accents -->
  <circle cx="256" cy="116" r="14" fill="#fecdd3" opacity="0.7"/>
  <circle cx="256" cy="396" r="14" fill="#fecdd3" opacity="0.7"/>
  <circle cx="116" cy="256" r="14" fill="#fecdd3" opacity="0.7"/>
  <circle cx="396" cy="256" r="14" fill="#fecdd3" opacity="0.7"/>
  <!-- Japanese Kanji '日' -->
  <text x="256" y="324" font-family="'Noto Sans JP', 'Hiragino Sans', -apple-system, sans-serif" font-size="200" font-weight="700" fill="#ffffff" text-anchor="middle">日</text>
</svg>
